# --- JVM ---------------------------------------------------------------------
# 4 GB is enough for this module and leaves room for the emulator on a 16 GB
# laptop. Raise only if you see OutOfMemoryError during :app:compileDebugKotlin.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# --- Build speed -------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Android -----------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin ------------------------------------------------------------------
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Public AI endpoint; the Groq credential stays in Cloudflare Worker Secrets.
sessionAiUrl=https://volleyball-lab-session-ai.volleyball-lab-session-ai.workers.dev/explainTrainingSession
